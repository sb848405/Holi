<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nara Pora - Our Story</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Merriweather:ital,wght@0,300;0,400;1,300&family=Outfit:wght@300;400&display=swap');

        body {
            font-family: 'Merriweather', serif;
            background-color: #0f0c29;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1, h2, .script-font {
            font-family: 'Dancing Script', cursive;
        }

        .sans-font {
            font-family: 'Outfit', sans-serif;
        }

        .cinematic-bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 0vh;
            background-color: black;
            z-index: 50;
            transition: height 2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .cinematic-bar.active {
            height: 12vh;
        }

        .top-bar { top: 0; }
        .bottom-bar { bottom: 0; }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .ground-surface {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50vh;
            background: linear-gradient(to top, #022c22 0%, #06382a 20%, rgba(6, 56, 42, 0.4) 60%, rgba(15, 12, 41, 0) 100%);
            z-index: 5;
            pointer-events: none;
        }
        
        @keyframes moon-rise {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .moon-group {
            animation: moon-rise 3s ease-out forwards;
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05) skewX(2deg); opacity: 1; }
            25% { transform: scale(0.95) skewX(-2deg); opacity: 0.8; }
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(0); }
            95% { transform: scaleY(1); }
        }

        .eyelid {
            transform-origin: top;
            animation: blink 4s infinite linear;
        }

        .flame-layer-1 { animation: flicker 3s infinite alternate ease-in-out; transform-origin: center bottom; }
        .flame-layer-2 { animation: flicker 2s infinite alternate-reverse ease-in-out; transform-origin: center bottom; }
        .flame-layer-3 { animation: flicker 1.5s infinite alternate ease-in-out; transform-origin: center bottom; }
        
        .spark-particle { fill: #fbbf24; opacity: 0; }
        .active-fire .spark-particle { animation: rise 3s infinite; }
        
        .spark-particle:nth-child(1) { animation-delay: 0.2s; }
        .spark-particle:nth-child(2) { animation-delay: 0.5s; }
        .spark-particle:nth-child(3) { animation-delay: 0.8s; }
        .spark-particle:nth-child(4) { animation-delay: 1.2s; }

        .main-stage {
            position: relative;
            z-index: 10;
            height: 76vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 2rem;
        }

        #story-display {
            position: absolute;
            top: 5%; /* Higher on mobile to avoid fire overlap */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        
        @media (min-width: 768px) {
            #story-display {
                top: 10%;
            }
        }

        .story-slide {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            position: absolute;
            width: 100%;
        }

        .story-slide.active {
            opacity: 1;
            transform: translateY(0);
        }

        .story-slide.exit {
            opacity: 0;
            transform: translateY(-20px);
        }

        #igniteBtn {
            transition: all 0.5s ease;
            z-index: 30;
        }
    </style>
</head>
<body>

    <audio id="bgAudio" loop>
        <source src="Aud.mp3" type="audio/mpeg">
    </audio>

    <div class="cinematic-bar top-bar" id="top-bar"></div>
    <div class="cinematic-bar bottom-bar" id="bottom-bar"></div>

    <div class="stars-container">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="moon-glow">
                     <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                     <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                     </feMerge>
                </filter>
            </defs>

            <g class="moon-group">
                <circle cx="85%" cy="20%" r="30" class="md:r-40 md:cy-25%" fill="#ffffff" opacity="0.1" filter="url(#moon-glow)" />
                <circle cx="85%" cy="20%" r="20" class="md:r-25 md:cy-25%" fill="#fdf4dc" filter="url(#moon-glow)" />
                <circle cx="86%" cy="18%" r="4" class="md:r-5 md:cy-23%" fill="#e2d5b5" opacity="0.5" />
                <circle cx="83%" cy="21%" r="2" class="md:r-3 md:cy-26%" fill="#e2d5b5" opacity="0.5" />
                <circle cx="87%" cy="23%" r="1.5" class="md:r-2 md:cy-28%" fill="#e2d5b5" opacity="0.5" />
            </g>

            <circle cx="10%" cy="20%" r="1" fill="white" opacity="0.8" />
            <circle cx="30%" cy="50%" r="1.5" fill="white" opacity="0.6" />
            <circle cx="70%" cy="10%" r="1" fill="white" opacity="0.7" />
            <circle cx="90%" cy="80%" r="2" fill="#fbbf24" opacity="0.4" filter="url(#glow)" />
            <circle cx="50%" cy="90%" r="1" fill="white" opacity="0.5" />
        </svg>
    </div>

    <!-- Couple Owls - Responsive Sizing and Positioning -->
    <svg viewBox="0 0 260 140" class="absolute top-[12%] -left-4 w-48 md:w-64 md:top-[15%] md:-left-5 z-[4] pointer-events-none">
        <path d="M0,110 Q80,120 220,80" stroke="#271c19" stroke-width="7" fill="none" stroke-linecap="round" />
        <path d="M70,105 Q70,80 60,70" stroke="#271c19" stroke-width="3" fill="none" stroke-linecap="round" />

        <g transform="translate(110, 60)">
            <path d="M-8,30 L-8,34" stroke="#d97706" stroke-width="3" />
            <path d="M8,30 L8,34" stroke="#d97706" stroke-width="3" />
            <path d="M-10,30 L0,45 L10,30" fill="#3f2e2e" />
            <ellipse cx="0" cy="15" rx="20" ry="25" fill="#4a3735" />
            <ellipse cx="0" cy="15" rx="15" ry="20" fill="#5d4037" />
            <circle cx="0" cy="-10" r="18" fill="#4a3735" />
            <path d="M-14,-18 L-18,-28 L-5,-22 Z" fill="#4a3735" />
            <path d="M14,-18 L18,-28 L5,-22 Z" fill="#4a3735" />
            
            <g>
                <circle cx="-8" cy="-10" r="6" fill="#fbbf24" />
                <circle cx="8" cy="-10" r="6" fill="#fbbf24" />
                <circle cx="-8" cy="-10" r="2.5" fill="#000" />
                <circle cx="8" cy="-10" r="2.5" fill="#000" />
                <rect x="-15" y="-18" width="30" height="18" fill="#4a3735" class="eyelid" style="animation-delay: 0.5s;" />
            </g>
            <path d="M-3,-4 L3,-4 L0,2 Z" fill="#f59e0b" />
        </g>

        <g transform="translate(170, 52) scale(0.9) rotate(5)">
            <path d="M-8,30 L-8,34" stroke="#d97706" stroke-width="3" />
            <path d="M8,30 L8,34" stroke="#d97706" stroke-width="3" />
            <path d="M-10,30 L0,45 L10,30" fill="#3f2e2e" />
            <ellipse cx="0" cy="15" rx="20" ry="25" fill="#5d4037" />
            <ellipse cx="0" cy="15" rx="15" ry="20" fill="#4a3735" />
            <circle cx="0" cy="-10" r="18" fill="#5d4037" />
            <path d="M-14,-18 L-18,-28 L-5,-22 Z" fill="#5d4037" />
            <path d="M14,-18 L18,-28 L5,-22 Z" fill="#5d4037" />
            
            <g>
                <circle cx="-8" cy="-10" r="6" fill="#fbbf24" />
                <circle cx="8" cy="-10" r="6" fill="#fbbf24" />
                <circle cx="-8" cy="-10" r="2.5" fill="#000" />
                <circle cx="8" cy="-10" r="2.5" fill="#000" />
                <rect x="-15" y="-18" width="30" height="18" fill="#5d4037" class="eyelid" style="animation-duration: 3s;" />
            </g>
            <path d="M-3,-4 L3,-4 L0,2 Z" fill="#f59e0b" />
        </g>
    </svg>

    <div class="ground-surface"></div>

    <div class="main-stage">
        
        <div id="story-display">
            <div id="intro-title" class="story-slide active">
                <h1 class="text-4xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-br from-orange-200 to-amber-500 mb-2 leading-tight drop-shadow-lg">
                    Nara Pora
                </h1>
                <p class="text-gray-400 sans-font text-xs md:text-sm tracking-widest uppercase">The night before colors</p>
            </div>
        </div>

        <div class="relative">
            <svg id="bonfire-svg" viewBox="0 0 200 200" class="overflow-visible mb-4 w-60 h-48 md:w-[300px] md:h-[240px]">
                <defs>
                    <radialGradient id="fireGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ff5e00" />
                        <stop offset="100%" stop-color="transparent" />
                    </radialGradient>
                    <linearGradient id="stoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4B5563" />
                        <stop offset="50%" stop-color="#374151" />
                        <stop offset="100%" stop-color="#1F2937" />
                    </linearGradient>
                    <radialGradient id="grassGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="#022c22" /> 
                        <stop offset="100%" stop-color="#022c22" stop-opacity="0" /> 
                    </radialGradient>
                    <linearGradient id="plantGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#0f291e" /> 
                        <stop offset="100%" stop-color="#22c55e" opacity="0.6" /> 
                    </linearGradient>
                </defs>
                
                <ellipse cx="100" cy="185" rx="160" ry="45" fill="url(#grassGradient)" opacity="1" />

                <g id="scattered-plants" opacity="0.8">
                    <path d="M-40,170 Q-45,160 -50,165 M-40,170 Q-38,155 -35,165 M-40,170 Q-30,165 -25,168" stroke="url(#plantGradient)" stroke-width="1.5" fill="none"/>
                    <path d="M-10,195 Q-15,185 -20,190 M-10,195 Q-8,180 -5,190 M-10,195 Q0,190 5,193" stroke="url(#plantGradient)" stroke-width="1.5" fill="none"/>
                    <path d="M-60,160 Q-65,150 -70,155 M-60,160 Q-58,145 -55,155" stroke="url(#plantGradient)" stroke-width="1" fill="none"/>
                    <path d="M20,205 Q15,195 10,200 M20,205 Q22,190 25,200" stroke="url(#plantGradient)" stroke-width="1.5" fill="none"/>

                    <path d="M240,170 Q235,160 230,165 M240,170 Q242,155 245,165 M240,170 Q250,165 255,168" stroke="url(#plantGradient)" stroke-width="1.5" fill="none"/>
                    <path d="M210,195 Q205,185 200,190 M210,195 Q212,180 215,190 M210,195 Q220,190 225,193" stroke="url(#plantGradient)" stroke-width="1.5" fill="none"/>
                    <path d="M260,160 Q255,150 250,155 M260,160 Q262,145 265,155" stroke="url(#plantGradient)" stroke-width="1" fill="none"/>
                    <path d="M180,205 Q175,195 170,200 M180,205 Q182,190 185,200" stroke="url(#plantGradient)" stroke-width="1.5" fill="none"/>

                    <path d="M0,150 Q-5,140 -10,145 M0,150 Q2,135 5,145" stroke="url(#plantGradient)" stroke-width="1" fill="none" opacity="0.6"/>
                    <path d="M200,150 Q195,140 190,145 M200,150 Q202,135 205,145" stroke="url(#plantGradient)" stroke-width="1" fill="none" opacity="0.6"/>
                    
                    <path d="M100,220 Q95,210 90,215 M100,220 Q102,205 105,215 M100,220 Q110,215 115,218" stroke="url(#plantGradient)" stroke-width="1.5" fill="none"/>
                </g>

                <circle id="fire-glow" cx="100" cy="160" r="80" fill="url(#fireGradient)" opacity="0" class="transition-opacity duration-1000" />

                <g>
                    <ellipse cx="100" cy="180" rx="140" ry="35" fill="#000" opacity="0.3" filter="blur(20px)" />

                    <path d="M-10,150 Q5,145 20,152 Q25,160 5,165 Q-15,162 -10,150 Z" fill="url(#stoneGradient)" stroke="#1F2937" stroke-width="0.5"/>

                    <path d="M180,152 Q200,145 210,150 Q215,162 195,165 Q175,160 180,152 Z" fill="url(#stoneGradient)" stroke="#1F2937" stroke-width="0.5"/>

                    <path d="M-80,165 Q-60,155 -30,165 Q-25,175 -60,180 Q-90,175 -80,165 Z" fill="url(#stoneGradient)" stroke="#1F2937" stroke-width="0.5"/>
                    <path d="M-70,167 Q-50,158 -40,167" fill="none" stroke="#6B7280" stroke-width="1" opacity="0.3" />

                    <path d="M230,165 Q260,155 280,165 Q285,175 240,180 Q220,175 230,165 Z" fill="url(#stoneGradient)" stroke="#1F2937" stroke-width="0.5"/>
                    <path d="M240,167 Q260,158 270,167" fill="none" stroke="#6B7280" stroke-width="1" opacity="0.3" />

                    <path d="M-50,185 Q-30,175 10,185 Q5,200 -40,200 Q-60,195 -50,185 Z" fill="url(#stoneGradient)" stroke="#1F2937" stroke-width="0.5"/>
                    <path d="M-40,187 Q-20,178 0,187" fill="none" stroke="#6B7280" stroke-width="1" opacity="0.3" />

                    <path d="M190,185 Q220,175 250,185 Q255,200 200,200 Q180,195 190,185 Z" fill="url(#stoneGradient)" stroke="#1F2937" stroke-width="0.5"/>
                    <path d="M200,187 Q230,178 240,187" fill="none" stroke="#6B7280" stroke-width="1" opacity="0.3" />
                </g>

                <g transform="translate(0, 10)">
                    <path d="M60,170 L140,150 L145,160 L65,180 Z" fill="#3f2e2e" />
                    <path d="M140,170 L60,150 L55,160 L135,180 Z" fill="#2d1b19" />
                    <path d="M70,180 L130,180 L130,190 L70,190 Z" fill="#4a3735" />
                </g>

                <g id="flames-group" class="opacity-0 transition-all duration-2000 ease-in-out transform scale-50 origin-bottom">
                    <path class="flame-layer-1" d="M100,180 Q130,150 120,100 Q100,40 100,30 Q100,40 80,100 Q70,150 100,180" fill="#dc2626" opacity="0.8"/>
                    <path class="flame-layer-2" d="M100,175 Q120,140 115,110 Q100,60 100,50 Q100,60 85,110 Q80,140 100,175" fill="#ea580c" opacity="0.8"/>
                    <path class="flame-layer-3" d="M100,170 Q110,150 108,130 Q100,90 100,80 Q100,90 92,130 Q90,150 100,170" fill="#fcd34d" opacity="0.9"/>
                    
                    <circle class="spark-particle" cx="90" cy="120" r="1.5" />
                    <circle class="spark-particle" cx="110" cy="130" r="2" />
                    <circle class="spark-particle" cx="100" cy="100" r="1.5" />
                    <circle class="spark-particle" cx="80" cy="140" r="1.5" />
                </g>
            </svg>
        </div>

        <button id="igniteBtn" class="px-8 py-2 bg-transparent border border-orange-500 text-orange-400 rounded-sm hover:bg-orange-500 hover:text-white uppercase text-xs tracking-[0.2em] cursor-pointer mb-8 shadow-[0_0_15px_rgba(234,88,12,0.3)]">
            Start Story
        </button>

        <button id="holiBtn" class="absolute bottom-20 md:bottom-10 px-8 py-3 bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 text-white font-bold rounded-full shadow-[0_0_20px_rgba(236,72,153,0.6)] transition-all duration-1000 opacity-0 pointer-events-none translate-y-4 hover:scale-110 hover:shadow-[0_0_30px_rgba(236,72,153,0.8)] z-30 font-sans tracking-wide">
            Ready to play Holi? 🎨
        </button>

    </div>

    <script>
        const igniteBtn = document.getElementById('igniteBtn');
        const holiBtn = document.getElementById('holiBtn');
        const bgAudio = document.getElementById('bgAudio');
        const flamesGroup = document.getElementById('flames-group');
        const fireGlow = document.getElementById('fire-glow');
        const storyDisplay = document.getElementById('story-display');
        const introTitle = document.getElementById('intro-title');
        const topBar = document.getElementById('top-bar');
        const bottomBar = document.getElementById('bottom-bar');
        
        let isLit = false;

        holiBtn.addEventListener('click', () => {
            window.location.href = 'holi.html';
        });

        const storySequence = [
            {
                title: "I. The Gathering",
                text: "We gather dry leaves to build a shelter for things we wish to leave behind—ego, sadness, distance.",
                color: "text-orange-200"
            },
            {
                title: "II. The Realization",
                text: "But as I watch the pile grow, I don't think of what I'm leaving. I think of what I'm moving towards.",
                color: "text-orange-100"
            },
            {
                title: "III. The Spark",
                text: "The fire burns for tradition. But tonight, my heart burns for you.",
                color: "text-rose-200"
            },
            {
                title: "Make a Wish",
                text: "Legend says the fire carries wishes to the heavens. <br>Happy Nara Pora. ❤️",
                color: "text-amber-100",
                isLast: true
            }
        ];

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function playStory() {
            introTitle.classList.remove('active');
            introTitle.classList.add('exit');
            await wait(1000);
            introTitle.remove();

            for (let i = 0; i < storySequence.length; i++) {
                const chapter = storySequence[i];
                
                const slide = document.createElement('div');
                slide.className = 'story-slide';
                slide.innerHTML = `
                    <h2 class="text-3xl md:text-4xl script-font mb-4 ${chapter.color}">${chapter.title}</h2>
                    <p class="text-lg md:text-xl leading-relaxed font-light italic text-gray-200">
                        "${chapter.text}"
                    </p>
                `;
                storyDisplay.appendChild(slide);

                await wait(50); 
                slide.classList.add('active');

                if (chapter.isLast) {
                    holiBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                }

                const readTime = chapter.isLast ? 8000 : 4500;
                await wait(readTime);

                if (!chapter.isLast) {
                    slide.classList.remove('active');
                    slide.classList.add('exit');
                    await wait(1000);
                    slide.remove();
                }
            }
        }

        igniteBtn.addEventListener('click', () => {
            if(!isLit) {
                isLit = true;

                bgAudio.volume = 0.4;
                bgAudio.play().catch(e => console.log("Audio autoplay prevented:", e));

                topBar.classList.add('active');
                bottomBar.classList.add('active');

                flamesGroup.classList.remove('opacity-0', 'scale-50');
                flamesGroup.classList.add('opacity-100', 'scale-100', 'active-fire');
                fireGlow.classList.remove('opacity-0');
                fireGlow.classList.add('opacity-40');
                
                igniteBtn.style.opacity = '0';
                igniteBtn.style.pointerEvents = 'none';

                playStory();
            }
        });
    </script>
</body>
</html>
